services:
  - type: web
    name: eskiflow
    runtime: node
    buildCommand: npm install && npm run build && npx esbuild server.ts --bundle --platform=node --packages=external --format=esm --outfile=server.compiled.js
    startCommand: node server.compiled.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
    autoDeploy: true
